<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H'ES SHOP — Upload</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f1c;color:#eaf2ff;font:16px system-ui,sans-serif;padding:20px}
.c{width:100%;max-width:420px;background:#1b2030;border:1px solid #2b3348;border-radius:20px;padding:24px;text-align:center}
h1{font-size:20px;margin:0 0 6px}p{color:#8b98b5;margin:6px 0 18px;word-break:break-word}
label{display:block;padding:16px;border:2px dashed #2b3348;border-radius:14px;cursor:pointer;color:#39c0ff}
input{display:none}.bar{height:10px;background:#0b0f1c;border-radius:9px;overflow:hidden;margin-top:18px;display:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0d47a1,#39c0ff);transition:width .2s}
#st{margin-top:12px;min-height:22px}
</style></head><body><div class="c"><h1>Upload to H'ES SHOP</h1><p id="t">Loading…</p>
<label id="lb" style="display:none">Choose the APK / file<input type="file" id="f"></label>
<div class="bar" id="b"><i id="p"></i></div><div id="st"></div></div>
<script type="module">
import { uploadPresigned } from 'https://esm.sh/@vercel/blob/client';
const $=id=>document.getElementById(id),tok=new URLSearchParams(location.search).get('k')||'';
let info=null;
try{const r=await fetch('/api/upload?k='+encodeURIComponent(tok));info=r.ok?await r.json():null}catch{}
if(!info){$('t').textContent='This link has expired. Ask the bot for a new one with /upload.'}
else{$('t').textContent=info.title;$('lb').style.display='block'}
$('f').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 const ext=(f.name.split('.').pop()||'').toLowerCase(),safe=info.title.replace(/[\\/:*?"<>|]+/g,' ').trim().slice(0,80)||'file';
 const path=`files/${info.id}/H'ES SHOP - ${safe}${ext&&ext!==f.name.toLowerCase()?'.'+ext:''}`;
 $('lb').style.display='none';$('b').style.display='block';$('st').textContent='Uploading… do not close this page';
 try{
  const opt=access=>({access,handleUploadUrl:'/api/upload',clientPayload:JSON.stringify({token:tok}),multipart:true,onUploadProgress:({percentage})=>{$('p').style.width=percentage+'%';$('st').textContent='Uploading… '+Math.round(percentage)+'%'}});
  let bl;try{bl=await uploadPresigned(path,f,opt('public'))}catch(e1){try{bl=await uploadPresigned(path,f,opt('private'))}catch(e2){throw e1}}
  const r=await fetch('/api/upload',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({done:1,token:tok,url:bl.url,size:f.size,name:f.name})});
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Error');
  $('st').textContent='✅ Done! The file is now downloadable from the site.';
 }catch(err){$('st').textContent='❌ '+err.message;$('lb').style.display='block'}
};
</script></body></html>
